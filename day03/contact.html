<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact MasterClass — get in touch with our team.">
    <title>Contact — MasterClass</title>
    <link rel="icon" href="logologo.png" type="image/png">
    <link rel="stylesheet" href="landing_page.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
        <div class="container">
            <div class="site-brand">
                <img src="logologo.png" alt="MasterClass Logo" width="52" style="border-radius:8px;">
                <div>
                    <h1 style="font-size:18px;margin-bottom:4px;color:var(--bg);">MasterClass</h1>
                    <p style="color:var(--bg);font-size:12px;">Practical courses to build modern web skills</p>
                </div>
            </div>
            <ul class="nav-links">
                <li><a href="landing_page.html">Home</a></li>
                <li><a href="landing_page.html#courses">Courses</a></li>
                <li><a href="aboutus.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </header>
    <main id="main-content" style="max-width:1100px;margin:24px auto;padding:0 36px;">
        <header style="margin-bottom:18px;">
            <h1>Contact Us</h1>
            <p style="color:var(--muted);">Questions about courses, schedules, or partnerships? Send us a message.</p>
        </header>
        <div style="background:var(--card);padding:20px;border-radius:12px;box-shadow:0 8px 24px rgba(12,18,25,0.04);">
            <form style="display:flex;flex-direction:column;gap:8px;margin-top:8px;" action="#" method="post">
                <label for="name" style="display:none">Your name</label>
                <input id="name" name="name" type="text" placeholder="Your name" style="padding:10px;border-radius:8px;border:1px solid #e6e9ee;">
                <label for="email" style="display:none">Email</label>
                <input id="email" name="email" type="email" placeholder="Email" style="padding:10px;border-radius:8px;border:1px solid #e6e9ee;">
                <label for="message" style="display:none">Message</label>
                <textarea id="message" name="message" placeholder="Message" rows="6" style="padding:10px;border-radius:8px;border:1px solid #e6e9ee;"></textarea>
                <div style="margin-top:6px;"><button type="submit" class="cta-btn">Send Message</button></div>
            </form>
        </div>
        <footer style="margin-top:20px;">
            <p>&copy; 2026 MasterClass</p>
        </footer>
    </main>
</body>
</html>
