<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterClass Login</title>
    <style>
        :root{
            --bg:#F8FAFC;
            --surface:#FFFFFF;
            --primary:#2563EB;
            --accent:#FF5A1F;
            --text:#1E293B;
            --muted:#64748B;
            --border:#E2E8F0;
        }

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, rgba(37,99,235,0.12), rgba(248,250,252,1));
            color: var(--text);
        }

        .login-page{
            width: min(460px, 100%);
            padding: 34px 30px;
            background: var(--surface);
            border: 1px solid rgba(37,99,235,0.14);
            border-radius: 28px;
            box-shadow: 0 24px 80px rgba(37,99,235,0.08);
        }

        .login-brand{
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
        }

        .login-brand img{
            width: 52px;
            height: 52px;
            border-radius: 16px;
            object-fit: cover;
            border: 1px solid rgba(37,99,235,0.2);
        }

        .login-brand h1{
            font-size: 1.3rem;
            color: var(--text);
        }

        .login-brand p{
            color: var(--muted);
            font-size: 0.95rem;
        }

        h2{
            font-size: 1.6rem;
            margin-bottom: 18px;
            color: var(--text);
        }

        form{
            display: grid;
            gap: 16px;
        }

        input{
            width: 100%;
            padding: 14px 18px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
        }

        input:focus{
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37,99,235,0.12);
        }

        .button-group{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button{
            border: none;
            border-radius: 16px;
            padding: 14px 18px;
            cursor: pointer;
            font-weight: 700;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        button:hover{
            transform: translateY(-1px);
            filter: brightness(1.03);
        }

        .submit{
            background: var(--primary);
            color: #fff;
        }

        .reset{
            background: rgba(37,99,235,0.08);
            color: var(--text);
        }

        .footer-text{
            margin-top: 24px;
            text-align: center;
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .footer-text a{
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        .footer-text a:hover{
            text-decoration: underline;
        }

        @media (max-width: 520px){
            .login-page{
                padding: 26px 20px;
            }

            .button-group{
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-brand">
            <img src="../day3/logologo.png" alt="MasterClass Logo">
            <div>
                <h1>MasterClass Login</h1>
                <p>Access your courses, progress, and account settings.</p>
            </div>
        </div>

        <h2>Sign in to continue</h2>

        <form>
            <input type="text" placeholder="Username" required>
            <input type="password" placeholder="Password" required>
            <div class="button-group">
                <button type="submit" class="submit">Login</button>
                <button type="reset" class="reset">Reset</button>
            </div>
        </form>

        <p class="footer-text">
            New to MasterClass? <a href="REG FORM.html">Register here</a>
        </p>
        <p class="footer-text">
            <a href="../day3/landing_page.html">Back to homepage</a>
        </p>
    </div>
</body>
</html>
