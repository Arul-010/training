<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterClass Registration</title>
    <style>
        :root{
            --bg:#F8FAFC;
            --surface:#FFFFFF;
            --primary:#2563EB;
            --accent:#FF5A1F;
            --text:#1E293B;
            --muted:#64748B;
            --border:#E2E8F0;
        }

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, rgba(37,99,235,0.12), rgba(248,250,252,1));
            color: var(--text);
        }

        .register-page{
            width: min(680px, 100%);
            margin: 24px;
            padding: 32px 32px 28px;
            background: var(--surface);
            border: 1px solid rgba(37,99,235,0.12);
            border-radius: 28px;
            box-shadow: 0 24px 80px rgba(37,99,235,0.1);
        }

        .register-header{
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 28px;
        }

        .register-header h1{
            font-size: 1.8rem;
            color: var(--text);
        }

        .register-header p{
            color: var(--muted);
            max-width: 420px;
            line-height: 1.7;
        }

        .register-form{
            display: grid;
            gap: 18px;
        }

        .field-group{
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .field-group.full{
            grid-template-columns: 1fr;
        }

        label{
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text);
        }

        input,
        select,
        textarea{
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
        }

        input:focus,
        select:focus,
        textarea:focus{
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37,99,235,0.12);
        }

        .radio-group{
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
        }

        .radio-group label{
            font-weight: 400;
        }

        .radio-group input{
            width: auto;
            margin-right: 6px;
        }

        .button-row{
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 4px;
        }

        button{
            border: none;
            border-radius: 16px;
            padding: 14px 22px;
            cursor: pointer;
            font-weight: 700;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        button:hover{
            transform: translateY(-1px);
            filter: brightness(1.04);
        }

        .submit-btn{
            background: var(--primary);
            color: #fff;
        }

        .reset-btn{
            background: rgba(37,99,235,0.08);
            color: var(--text);
        }

        .support-text{
            margin-top: 24px;
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .support-text a{
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        @media (max-width: 780px){
            .register-header{
                flex-direction: column;
                align-items: flex-start;
            }

            .field-group{
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="register-page">
        <div class="register-header">
            <div>
                <h1>Student Registration</h1>
                <p>Register now to access our MasterClass learning tracks, mentorship, and hands-on project libraries.</p>
            </div>
        </div>

        <form class="register-form">
            <div class="field-group">
                <div>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
            </div>

            <div class="field-group">
                <div>
                    <label for="regno">Registration No</label>
                    <input type="text" id="regno" name="regno" placeholder="Enter registration number" required>
                </div>
                <div>
                    <label for="phone">Phone No</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter phone number" required>
                </div>
            </div>

            <div class="field-group">
                <div>
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required>
                </div>
                <div>
                    <label for="department">Department</label>
                    <select id="department" name="department" required>
                        <option value="">Select department</option>
                        <option value="cse">CSE</option>
                        <option value="ece">ECE</option>
                        <option value="it">IT</option>
                        <option value="aids">AI & DS</option>
                    </select>
                </div>
            </div>

            <div class="field-group">
                <div>
                    <label for="section">Section</label>
                    <input type="text" id="section" name="section" placeholder="Enter section" required>
                </div>
                <div>
                    <label>Gender</label>
                    <div class="radio-group">
                        <label><input type="radio" name="gender" value="male" required> Male</label>
                        <label><input type="radio" name="gender" value="female"> Female</label>
                        <label><input type="radio" name="gender" value="other"> Other</label>
                    </div>
                </div>
            </div>

            <div class="field-group full">
                <div>
                    <label for="city">City</label>
                    <select id="city" name="city" required>
                        <option value="">Select city</option>
                        <option value="coimbatore">Coimbatore</option>
                        <option value="chennai">Chennai</option>
                        <option value="bengaluru">Bengaluru</option>
                    </select>
                </div>
            </div>

            <div class="field-group full">
                <div>
                    <label for="remarks">Remarks</label>
                    <textarea id="remarks" name="remarks" rows="4" placeholder="Enter any additional details"></textarea>
                </div>
            </div>

            <div class="button-row">
                <button type="submit" class="submit-btn">Register</button>
                <button type="reset" class="reset-btn">Reset</button>
            </div>
        </form>

        <p class="support-text">
            Already enrolled? <a href="login_page.html">Sign in here</a> or go back to <a href="../day3/landing_page.html">home</a>.
        </p>
    </div>
</body>
</html>
